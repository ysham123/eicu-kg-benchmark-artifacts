name: release-checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/verify_release.py
      - run: sha256sum -c MANIFEST.sha256
